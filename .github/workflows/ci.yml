name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The whole supported range (requires-python >=3.11). mypy checks at the
    # floor (python_version = "3.11"); tests run on every leg.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aci
          POSTGRES_PASSWORD: aci
          POSTGRES_DB: aci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ACI_DATABASE_URL: postgresql+psycopg://aci:aci@localhost:5432/aci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Install from the hashed, universal lock (pyproject keeps `>=` ranges for
      # library consumers). `semantic` is in the lock too: mypy (strict)
      # type-checks the FastEmbedEmbedder import in model_provider/semantic.py.
      # `pip check` fails if pyproject gained/changed a dep the lock lacks.
      # Regenerate the lock after any pyproject dependency change:
      #   uv pip compile pyproject.toml --extra dev --extra semantic --universal \
      #     --python-version 3.11 --generate-hashes -o requirements-lock.txt
      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install -e . --no-deps
          pip check

      - run: ruff check src tests migrations scripts

      # migrations/ 0001-0008 predate the formatter; lint-only there.
      - run: ruff format --check src tests migrations scripts

      - run: python -m mypy src

      - run: alembic upgrade head

      - run: alembic check

      # pytest-timeout (timeout = 300 in pyproject) turns a hung test into a failure.
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists a PR's commits via the API

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fails the build on any known vulnerability in the locked set.
      # To accept one, add `--ignore-vuln <ID>` here with a comment giving the
      # justification (why unreachable / not exploitable here) and a revisit date.
      - name: pip-audit (locked dependencies)
        run: pipx run pip-audit==2.10.1 -r requirements-lock.txt --disable-pip

      # Skips (each justified) live in [tool.bandit] in pyproject.toml.
      # -ii: medium+ confidence only (drops the low-confidence B608 hit on a
      # constant WHERE fragment in rest/ui.py).
      - name: bandit (src)
        run: pipx run bandit==1.9.4 -c pyproject.toml -r src -q -ii

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false" # read-only token; the job log is the report
          # Inline config (default rules + allowlist). tests/unit/test_guardrails.py
          # holds fake secrets as the fixtures the guardrail is tested against.
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true

            [[allowlists]]
            description = "guardrail tests: fake secrets are the fixtures under test"
            paths = ['''^tests/unit/test_guardrails\.py$''']
