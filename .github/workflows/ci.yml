name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aci
          POSTGRES_PASSWORD: aci
          POSTGRES_DB: aci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ACI_DATABASE_URL: postgresql+psycopg://aci:aci@localhost:5432/aci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `semantic` too: mypy (strict) type-checks the FastEmbedEmbedder import
      # in model_provider/semantic.py — without the extra installed it fails
      # with import-not-found, and the local venv (which has it) would not
      # catch that drift.
      - run: pip install -e ".[dev,semantic]"

      - run: ruff check src tests

      - run: ruff format --check src tests

      - run: python -m mypy src

      - run: alembic upgrade head

      - run: python -m pytest -q
