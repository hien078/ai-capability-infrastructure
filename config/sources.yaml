# Source registry (plan §22 acquisition): WHAT to ingest, declaratively.
# The ingestion engine (scripts/ingest_real_skills.py) consumes this file —
# adding a source or a skill never requires editing engine logic.
#
# Fields per source:
#   repo:     upstream repository (cloned shallow, read-only)
#   commit:   pinned revision — upstream moves never silently re-ingest (§38)
#   license:  optional manual SPDX override; omit = auto-detect
#             (per-skill LICENSE.txt → repo-root LICENSE → manifest field)
#   skills:   paths (relative to repo root) of the picked skill packages
#
# Acquisition is capability-gap-driven (§22): every entry here exists because
# a measured gap asked for it — not to grow the corpus count (§55).

sources:
  - id: superpowers
    repo: https://github.com/obra/superpowers.git
    commit: 8ca22dba9a94f28898bbce59f2537ff4d87c747d
    # MIT detected from the repo-root LICENSE.
    skills:
      - skills/systematic-debugging
      - skills/test-driven-development
      - skills/brainstorming
      - skills/writing-plans
      - skills/verification-before-completion
      # §75 step 24 corpus growth (2026-09-28).
      - skills/diagnosing-superpowers
      - skills/dispatching-parallel-agents
      - skills/executing-plans
      - skills/finishing-a-development-branch
      - skills/receiving-code-review
      - skills/requesting-code-review
      - skills/subagent-driven-development
      - skills/using-git-worktrees
      - skills/using-superpowers
      - skills/writing-skills

  - id: anthropics-skills
    repo: https://github.com/anthropics/skills.git
    commit: 33375500bcea98d610eb30ce10ac4e59b89c390d
    # Apache-2.0 detected from per-skill LICENSE.txt; docx/pdf/pptx/xlsx stay
    # excluded (Proprietary).
    skills:
      - skills/mcp-builder
      - skills/webapp-testing
      - skills/skill-creator
      # §75 step 24 corpus growth (2026-09-28). docx/pdf/pptx/xlsx stay
      # excluded (Proprietary); doc-coauthoring carries no license at all
      # and is listed under "unknown" below.
      - skills/academy-guide
      - skills/algorithmic-art
      - skills/brand-guidelines
      - skills/canvas-design
      - skills/claude-api
      - skills/discernment-nudge
      - skills/frontend-design
      - skills/internal-comms
      - skills/slack-gif-creator
      - skills/theme-factory
      - skills/web-artifacts-builder

  - id: anthropics-skills-unknown
    repo: https://github.com/anthropics/skills.git
    commit: 33375500bcea98d610eb30ce10ac4e59b89c390d
    # Unknown license (no LICENSE.txt, no frontmatter field, no repo-root
    # fallback): the detector reports `unknown` and the skill stays
    # quarantined — §24 blocks production by default.
    skills:
      - skills/doc-coauthoring

  - id: ok-skills
    repo: https://github.com/mxyhi/ok-skills.git
    commit: 7de464066579c539f0ec0342abef83e8a1e994c2
    # V2 targeted corpus growth (§55, 2026-09-28): diagnosing-bugs and
    # codebase-design carry per-skill MIT; tdd falls back to the repo-root
    # Apache-2.0. improve-codebase-architecture is deliberately NOT
    # ingested: it declares `disable-model-invocation: true` and V1 routing
    # cannot honor that author intent.
    skills:
      - diagnosing-bugs
      - tdd
      - codebase-design

  - id: awesome-ai-agent-skills
    repo: https://github.com/seb1n/awesome-ai-agent-skills.git
    commit: 75865a5d037a4cdaa7f409a4ec14ab9b0292920b
    # MIT (repo root). prompt-injection-defense is included as
    # platform-domain coverage (§16.1/§17.1 concern).
    skills:
      - code-and-development/debugging
      - code-and-development/testing
      - code-and-development/refactoring
      - agent-security/prompt-injection-defense
