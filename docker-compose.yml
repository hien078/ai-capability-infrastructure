services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aci
      POSTGRES_PASSWORD: aci
      POSTGRES_DB: aci
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aci"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
