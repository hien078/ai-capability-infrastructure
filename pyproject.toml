[project]
name = "ai-capability-infrastructure"
version = "0.1.0"
description = "Reusable AI Capability Infrastructure (Architecture V2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "pyyaml>=6.0",
  "mcp>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.11",
  "uvicorn>=0.30",
  "types-pyyaml>=6.0",
]
# V2 semantic embedder (§55 "more sophisticated rerankers"): ONNX-based local
# embedding models, no torch. Optional so the core install stays light and
# offline-deterministic (HashingEmbedder remains the default baseline).
semantic = [
  "fastembed>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires live PostgreSQL (docker compose up -d db)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# 3.12: numpy (a fastembed dependency) ships stubs using `type` statements,
# which mypy rejects when targeting 3.11. The runtime venv is 3.13.
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"
