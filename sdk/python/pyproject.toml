[project]
name = "aci-client"
version = "0.1.0"
description = "Thin typed Python SDK for the ACI REST API (plan §31): routing, skills, outcomes, agent runs"
readme = "README.md"
requires-python = ">=3.11"
# Both are already pinned in the repo's requirements-lock.txt (no new deps).
# httpx is the HTTP client; pydantic backs the typed wire models.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aci_client"]

# Standalone development (`cd sdk/python && pytest`): the repo-root run uses
# the ROOT pyproject's testpaths/pythonpath instead (it lists sdk/python too).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: needs the aci package + a local PostgreSQL (skips otherwise)",
]
